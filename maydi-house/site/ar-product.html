<!doctype html>

<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عطر · مايدي هاوس</title>
<meta name="description" content="عطر من مايدي هاوس.">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="glass.css">
<style>
  .pdp { display: grid; grid-template-columns: 6fr 5fr; gap: clamp(2rem, 6vw, 6rem); align-items: start; padding-block: 2rem 5rem; }
  .pdp .frame { position: sticky; top: calc(var(--bar-h) + 1.5rem); background: var(--paper); aspect-ratio: 4 / 5; border-radius: 999px 999px 0 0; overflow: hidden;
    border: 1px solid color-mix(in oklab, var(--accent) 10%, transparent); }
  .pdp .frame img { width: 100%; height: 100%; object-fit: cover; }
  .pdp .house { font-size: .72rem; text-transform: uppercase; letter-spacing: .16em; color: var(--umber); }
  .pdp h1 { font-size: clamp(2.4rem, 4.6vw, 3.8rem); margin-top: .5rem; }
  .pdp .kind { margin-top: .4rem; color: var(--ink-soft); }
  .pdp .edition { margin-top: .8rem; }
  .price-row { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-top: 1.6rem; padding-block: 1rem; border-block: 1px solid var(--line); }
  .price-row .price-slot { font-family: var(--display); font-size: 1.5rem; }
  .price-row small { color: var(--ink-soft); }
  .sizes { margin-top: 1.4rem; }
  .sizes .label { font-size: .72rem; text-transform: uppercase; letter-spacing: .16em; color: var(--umber); }
  .sizes .opts { display: flex; gap: .6rem; margin-top: .6rem; flex-wrap: wrap; }
  .sizes button { font: 500 .9rem/1 var(--text); padding: .75rem 1.1rem; background: var(--paper); color: var(--ink); border: 1px solid var(--line); cursor: pointer; }
  .sizes button[aria-pressed="true"] { border-color: var(--accent); outline: 1px solid var(--accent); }
  .buy { display: grid; gap: .7rem; margin-top: 1.6rem; }
  .buy .btn { width: 100%; padding-block: 1.05rem; }
  .buy .note { font-size: .82rem; color: var(--ink-soft); text-align: center; }
  .story { margin-top: 2.4rem; font-family: var(--display); font-size: 1.2rem; line-height: 1.65; }
  .pyramid { margin-top: 2.4rem; border-top: 1px solid var(--line); }
  .pyramid .tier { display: grid; grid-template-columns: 7rem 1fr; gap: 1rem; padding-block: 1.1rem; border-bottom: 1px solid var(--line); }
  .pyramid .tier b { font-size: .72rem; text-transform: uppercase; letter-spacing: .16em; color: var(--umber); padding-top: .25rem; font-weight: 500; }
  .pyramid .tier p { font-family: var(--display); font-size: 1.12rem; }
  .pyramid h2, .more h2 { font-size: 1.5rem; margin: 2.4rem 0 1rem; }
  .missing { padding: 6rem 0; text-align: center; }
  @media (max-width: 860px) {
    .pdp { grid-template-columns: 1fr; }
    .pdp .frame { position: static; max-width: 30rem; }
  }
</style>
<link rel="icon" href="favicon.svg" type="image/svg+xml">

</head>
<body data-section="ar-boutique.html">
<header data-site-bar></header>
<main class="wrap" id="pdp-root"></main>
<footer data-site-foot></footer>
<script src="products.js"></script>
<script src="products-ar.js"></script>
<script src="site.js"></script>
<script>
  (function () {
    var slug = new URLSearchParams(location.search).get('p') || 'timbrose-ii';
    var key = MAYDI.renderProduct(slug, document.getElementById('pdp-root'));
    if (!key) return;
    // Where this product lives decides which part of the nav is current.
    document.body.setAttribute('data-section', 'ar-' + key + '.html');
    MAYDI.renderChrome(MAYDI.lang(), key);
  })();
</script>
