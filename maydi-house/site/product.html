<!doctype html>
<!-- One product template for every fragrance (v2 prototype): product.html?p=<slug>.
     Layout follows the client's reference product page (gafur.ae): image on one side,
     name, price, size and purchase on the other, then the story and the notes. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fragrance · Maydi House</title>
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="glass.css">
<style>
  .pdp { display: grid; grid-template-columns: 6fr 5fr; gap: clamp(2rem, 6vw, 6rem); align-items: start; padding-block: 2rem 5rem; }
  .pdp .frame { position: sticky; top: calc(var(--bar-h) + 1.5rem); background: var(--paper); aspect-ratio: 4 / 5; border-radius: 999px 999px 0 0; overflow: hidden;
    border: 1px solid color-mix(in oklab, var(--accent) 10%, transparent); }
  .pdp .frame img { width: 100%; height: 100%; object-fit: cover; }
  .pdp .house { font-size: .72rem; text-transform: uppercase; letter-spacing: .16em; color: var(--umber); }
  .pdp h1 { font-size: clamp(2.4rem, 4.6vw, 3.8rem); margin-top: .5rem; }
  .pdp .kind { margin-top: .4rem; color: var(--ink-soft); }
  .pdp .edition { margin-top: .8rem; }
  .price-row { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-top: 1.6rem; padding-block: 1rem; border-block: 1px solid var(--line); }
  .price-row .price-slot { font-family: var(--display); font-size: 1.5rem; }
  .price-row small { color: var(--ink-soft); }
  .sizes { margin-top: 1.4rem; }
  .sizes .label { font-size: .72rem; text-transform: uppercase; letter-spacing: .16em; color: var(--umber); }
  .sizes .opts { display: flex; gap: .6rem; margin-top: .6rem; flex-wrap: wrap; }
  .sizes button { font: 500 .9rem/1 var(--text); padding: .75rem 1.1rem; background: var(--paper); color: var(--ink); border: 1px solid var(--line); cursor: pointer; }
  .sizes button[aria-pressed="true"] { border-color: var(--accent); outline: 1px solid var(--accent); }
  .buy { display: grid; gap: .7rem; margin-top: 1.6rem; }
  .buy .btn { width: 100%; padding-block: 1.05rem; }
  .buy .note { font-size: .82rem; color: var(--ink-soft); text-align: center; }
  .story { margin-top: 2.4rem; font-family: var(--display); font-size: 1.2rem; line-height: 1.65; }
  .pyramid { margin-top: 2.4rem; border-top: 1px solid var(--line); }
  .pyramid .tier { display: grid; grid-template-columns: 7rem 1fr; gap: 1rem; padding-block: 1.1rem; border-bottom: 1px solid var(--line); }
  .pyramid .tier b { font-size: .72rem; text-transform: uppercase; letter-spacing: .16em; color: var(--umber); padding-top: .25rem; font-weight: 500; }
  .pyramid .tier p { font-family: var(--display); font-size: 1.12rem; }
  .pyramid h2, .more h2 { font-size: 1.5rem; margin: 2.4rem 0 1rem; }
  .missing { padding: 6rem 0; text-align: center; }
  @media (max-width: 860px) {
    .pdp { grid-template-columns: 1fr; }
    .pdp .frame { position: static; max-width: 30rem; }
  }
</style>
</head>
<body data-section="boutique.html">
<header data-site-bar></header>
<main class="wrap" id="pdp-root"></main>
<footer data-site-foot></footer>
<script src="products.js"></script>
<script src="site.js"></script>
<script>
  (function () {
    var slug = new URLSearchParams(location.search).get('p') || 'timbrose-ii';
    var p = maydiProduct(slug), root = document.getElementById('pdp-root');
    if (!p) {
      root.innerHTML = '<div class="missing"><h1>We could not find that fragrance.</h1><p class="muted" style="margin-top:1rem">It may have left the shelf. <a href="boutique.html">Return to the Boutique</a>.</p></div>';
      return;
    }
    // Where this product lives decides the crumbs and the "more" row.
    var home = p.house === 'Mohamed Abdo'
      ? (p.group === 'atelier' ? ['atelier.html', 'Maydi Atelier'] : ['mohamed-abdo.html', 'Mohamed Abdo'])
      : ['boutique.html', 'Maydi Boutique'];
    document.body.setAttribute('data-section', home[0]);
    document.querySelectorAll('.site-bar nav a').forEach(function (a) {
      a.toggleAttribute('aria-current', a.getAttribute('href') === home[0]);
      if (a.getAttribute('href') === home[0]) a.setAttribute('aria-current', 'page');
    });
    document.title = p.name + ' · ' + p.house + ' · Maydi House';

    var tiers = p.notes
      ? [['Top', p.notes.top], ['Heart', p.notes.heart], ['Base', p.notes.base], ['Accords', null]]
      : null;
    var notesHtml = tiers
      ? '<div class="pyramid"><h2>The notes</h2>' + tiers.map(function (t) {
          return '<div class="tier"><b>' + t[0] + '</b><p' + (t[1] ? '' : ' class="muted"') + '>' + (t[1] ? t[1].join(', ') : 'To come') + '</p></div>';
        }).join('') + '</div>'
      : (p.keyNotes && p.keyNotes.length
          ? '<div class="pyramid"><h2>Key notes</h2><div class="tier"><b>Notes</b><p>' + p.keyNotes.join(', ') + '</p></div></div>'
          : '<div class="pyramid"><h2>The notes</h2><div class="tier"><b>Notes</b><p class="muted">To come</p></div></div>');

    var atelier = p.group === 'atelier';
    var buy = atelier
      ? '<a class="btn" href="contact.html?topic=atelier&formula=' + p.slug + '">Request this formula for your brand</a>' +
        '<p class="note">A ready formula by Mohamed Abdo, released under your own name.</p>'
      : '<button class="btn" type="button" aria-disabled="true" title="Online ordering comes later">' + (p.soldOut ? 'Sold out' : 'Add to bag') + '</button>' +
        '<a class="btn btn--ghost" href="contact.html?topic=order&item=' + p.slug + '">Order through the house</a>' +
        '<p class="note">Online ordering opens later. For now, the house takes orders directly.</p>';

    var more = MAYDI_PRODUCTS.filter(function (x) { return x.slug !== p.slug && x.house === p.house; }).slice(0, 4);

    root.innerHTML =
      '<div class="crumbs" style="margin-top:2rem"><a href="index.html">Home</a> / <a href="' + home[0] + '">' + home[1] + '</a> / ' + p.name + '</div>' +
      '<article class="pdp">' +
        '<div class="frame"><img src="' + p.img + '" alt="' + (p.alt || p.name + ' by ' + p.house) + '"></div>' +
        '<div>' +
          '<div class="house">' + p.house + ' · ' + p.line + '</div>' +
          '<h1>' + p.name + '</h1>' +
          '<p class="kind">' + (p.kind || p.line) + '</p>' +
          (p.edition ? '<p class="edition"><span class="chip">' + p.edition + '</span></p>' : '') +
          '<div class="price-row"><span class="price-slot">Price</span><small>' + (atelier ? 'Formula pricing on request' : 'Prices to be announced') + '</small></div>' +
          '<div class="sizes"><div class="label">Size</div><div class="opts" id="sizes">' +
            p.sizes.map(function (s, i) { return '<button type="button" aria-pressed="' + (i === 0) + '">' + s + '</button>'; }).join('') +
          '</div></div>' +
          '<div class="buy">' + buy + '</div>' +
          '<p class="story">' + p.summary + '</p>' +
          notesHtml +
        '</div>' +
      '</article>' +
      (more.length ? '<section class="more" style="padding-bottom:5rem"><h2>More from ' + p.house + '</h2><div class="grid">' + more.map(maydiCard).join('') + '</div></section>' : '');

    document.getElementById('sizes').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      this.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    });
    maydiReveal(root);
  })();
</script>
<script src="glass.js"></script>
</body>
</html>
